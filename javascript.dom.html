<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <h1>Original Text</h1>
    <button onclick="onUpdateOrinalText()">Update H1 Text</button>

    <br />
    <br />
    <br />

    <button>-</button>
    <h1>1</h1>
    <button onclick="onIncrement()">+</button>
  </body>
</html>

<script>
  function onUpdateOrinalText() {
    document.getElementsByTagName('h1')[0].innerText = 'Purwadhika School';
  }

  function onIncrement() {
    let number = document.getElementsByTagName('h1')[1].innerText;
    number++;
    document.getElementsByTagName('h1')[1].innerText = number;
  }
</script>
