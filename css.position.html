<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.position.css">
</head>
<body>
    <!-- 
        Relative
        > Relatif terhadap posisi semula
        > Top/bottom/right/left dia akan meninggalkan space kosong
    -->
    <div id="container-01">
        <div>Box-01</div>
        <div>Box-02</div>
        <div>Box-03</div>
    </div>

    <h1 style="font-size: 30px; margin-top: 50px;">Absolute</h1>
    <!-- 
        Absolute
        > Relatif terhadap viewport (ketika parentnya tidak ada yg memiliki posisi relatif)
        > Relatif terhadap parent nya (ketika parentnya memiliki position relatif)
        > Top/bottom/right/left dia tidak meninggalkan space kosong
    -->
    <div id="container-02">
        <div>Box-04</div>
        <div>Box-05</div>
        <div>Box-06</div>
    </div>

    <!-- 
        Fixed
        > Relatif terhadap viewport
    -->
    <nav id="nav-01">
        Navbar
    </nav>
    <nav id="nav-02">
        Navbar
    </nav>
</body>
</html>
